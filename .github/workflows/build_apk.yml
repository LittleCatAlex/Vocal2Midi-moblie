name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36
          pip install git+https://github.com/kivy/python-for-android.git

      - name: Build APK with Buildozer
        run: |
          # buildozer uses the current directory's buildozer.spec
          # we pass 'y' to auto-accept Android SDK licenses
          export CFLAGS="-Wno-incompatible-function-pointer-types"
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vocal2Midi-APK
          path: bin/*.apk
